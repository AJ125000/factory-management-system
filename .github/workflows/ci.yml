name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  windows-installer:
    name: Windows installer
    needs: [backend, frontend]
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the installer to a release on version tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v7
      - name: Install build tools
        working-directory: backend
        run: uv sync --locked --extra desktop --group build
      - name: Package FMS.exe
        working-directory: backend
        run: uv run pyinstaller packaging/fms.spec --noconfirm
      - name: Smoke test the packaged hub
        working-directory: backend
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'fms-smoke'
          $hub = Start-Process -FilePath 'dist\FMS\FMS.exe' -PassThru `
            -ArgumentList '--no-tray', '--no-window', '--port', '8799', '--data-dir', $data
          $ok = $false
          foreach ($i in 1..40) {
            try { $ok = (Invoke-RestMethod 'http://127.0.0.1:8799/api/health').status -eq 'ok' } catch {}
            if ($ok) { break }
            Start-Sleep -Seconds 1
          }
          if ($ok) {
            $page = Invoke-WebRequest 'http://127.0.0.1:8799/dashboard'
            if ($page.Content -notmatch 'Factory Management System') { $ok = $false }
          }
          Stop-Process -Id $hub.Id -Force
          if (-not $ok) {
            Get-Content (Join-Path $data 'logs\fms.log') -ErrorAction SilentlyContinue
            throw 'The packaged hub did not start'
          }
          & 'dist\FMS\fms-admin.exe' --version
      - name: Build the installer
        working-directory: backend
        shell: pwsh
        run: |
          $version = uv run python -c "import fms; print(fms.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" 'packaging\windows\fms.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Get-ChildItem dist-installer
      - uses: actions/upload-artifact@v4
        with:
          name: FMS-Setup
          path: backend/dist-installer/FMS-Setup-*.exe
          if-no-files-found: error
      - name: Attach to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist-installer\FMS-Setup-*.exe) --title "FMS $env:GITHUB_REF_NAME" --generate-notes
